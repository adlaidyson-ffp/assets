<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITLE | Adlai Dyson | Fused Frame Photography</title>
    <style>
        /* Import custom Aptos fonts */
        @font-face {
            font-family: 'Aptos';
            src: url('https://cdn.fusedframe.co.uk/fonts/aptos/aptos-regular.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Aptos';
            src: url('https://cdn.fusedframe.co.uk/fonts/aptos/aptos-bold.woff2') format('woff2');
            font-weight: bold;
            font-style: normal;
        }

        /* Basic reset and body styling */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: 'Aptos', sans-serif;
            color: #e5e7eb;
            background-color: #1a1a1a; /* Fallback color */
        }

        /* Main container to position content */
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Align items to the top */
            min-height: 100vh;
            width: 100%;
            
            /* ADJUSTMENT: Reduced top padding from 1rem to 0.75rem for less space above the logo */
            padding: 0.50rem 2rem 2rem 2rem;
            
            box-sizing: border-box;

            /* Set the background image */
            background-image: url('https://cdn.fusedframe.co.uk/main-colours/backgrounds/2160/slight-gradient.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed; /* Keeps the background static on scroll */
        }

        /* Logo styling */
        .logo {
            /* ADJUSTMENT: Reduced size from 300px max-width/50% width to 200px max-width/40% width */
            max-width: 280px;
            width: 40%;
            height: auto;
            
            /* ADJUSTMENT: Reduced space between logo and card from 1rem to 0.75rem */
            margin-bottom: 0.75rem; 
        }

        /* The content card for better readability */
        .content-card {
            background-color: rgba(30, 55, 77, 0.7); /* Semi-transparent #1e374d */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 2rem 3rem;
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 1100px; /* Increased max-width for a fuller feel */
            width: 100%;
            box-sizing: border-box;
            min-height: 100px; /* Ensure it has a minimum height */
        }

        /* NEW: Header container for title and image */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 2rem; /* Space between title and image */
        }

        /* NEW: Container for just the text in the header */
        .title-section {
            flex-grow: 1; /* Allows text to take available space */
        }

        /* NEW: Styling for the header image */
        .header-image {
            max-width: 150px;
            height: auto;
            border-radius: 0.75rem; /* Rounded corners for the image */
        }

        /* Main title placeholder styling */
        h1 {
            font-family: 'Aptos', sans-serif;
            font-weight: bold;
            font-size: 2.5rem;
            margin: 0 0 0.75rem 0;
            color: #94fdf8;
            letter-spacing: 0.5px;
        }

        /* Subheading placeholder styling */
        h2 {
            font-family: 'Aptos', sans-serif;
            font-weight: normal;
            font-size: 1.25rem;
            margin: 0;
            color: #94fdf8;
        }

        /* Body text styling */
        p {
            font-family: 'Aptos', sans-serif;
            font-weight: normal;
            color: #e5e7eb;
            line-height: 1.6;
            font-size: 1rem;
        }
        
        /* Faint divider line */
        hr {
            border: 0;
            height: 1px;
            background-color: rgba(148, 253, 248, 0.2); /* Faint version of the title color */
            margin: 1.5rem 0;
        }

        /* NEW: Links section styling */
        .links-section {
            text-align: center;
            padding-top: 0.5rem;
        }

        .links-section a {
            color: #94fdf8;
            text-decoration: none;
            margin: 0 1rem;
            font-weight: bold;
            transition: text-decoration 0.3s ease;
        }

        .links-section a:hover {
            text-decoration: underline;
        }

        /* Responsive adjustments for smaller screens */
        @media (max-width: 768px) {
            .main-container {
                /* ADJUSTMENT: Reduced top padding for mobile, matching the new desktop top padding */
                padding: 0.75rem 1.5rem; 
            }
            
            .content-card {
                padding: 1.5rem 2rem;
            }

            /* NEW: Stack header items on smaller screens */
            .card-header {
                flex-direction: column;
            }

            .header-image {
                margin-top: 1.5rem;
                max-width: 120px;
            }

            h1 {
                font-size: 2rem;
            }

            h2 {
                font-size: 1.1rem;
            }
        }

        @media (max-width: 480px) {
            .main-container {
                /* ADJUSTMENT: Reduced top padding for very small mobile */
                padding: 0.5rem 1rem;
            }

            .content-card {
                padding: 1.5rem;
            }
            
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Logo -->
        <img src="https://cdn.fusedframe.co.uk/main-logos/png/Banner%20Logo%20(No%20Circle)%20Light%20(Transparent).png" alt="Fused Frame Logo" class="logo">

        <div class="content-card">
            <div class="card-header">
                <div class="title-section">
                    <!-- Title Placeholder -->
                    <h1>Title</h1>
                    <!-- Subheading Placeholder -->
                    <h2>Subheading.</h2>
                </div>
                <!-- Image -->
                <img src="https://placehold.co/150x150/1e374d/94fdf8?text=Your+Image" alt="placeholder image" class="header-image">
            </div>
            
            <!-- A faint visual divider -->
            <hr>
            
            <!-- Body Text Placeholder -->
            <p>
                Body 1.             </p>
            <p>
                Body 2.	</p>
            <p>
                Body 3.</p>
            <p>
                Body 4.
            </p>
            
            <!-- A second divider for the links section -->
            <hr>

            <!-- Links Section -->
            <div class="links-section">
                <a href="https://adffp.uk/links" target="_blank" rel="noopener noreferrer">Back to ...</a>
                <a href="https://adffp.uk/links" target="_blank" rel="noopener noreferrer">View on ...</a>
                <a href="https://adlaidyson.co.uk" target="_blank" rel="noopener noreferrer">Visit Adlai Dyson | Fused Frame Photography</a>
            </div>

        </div>
    </div>

</body>
</html>
